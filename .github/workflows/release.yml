name: Release

# Thin caller for the canonical reusable release pipeline (build ->
# semantic-release -> Docker -> MCP Registry -> security). On pull_request and
# workflow_dispatch only its unconditional verify job runs: the pinned reusable
# workflow publishes only on a push to main. No push trigger is configured yet,
# so nothing is published until the first release is approved and a
# `push: branches: [main]` trigger is added here deliberately.
on:
  workflow_dispatch:
  pull_request:
    branches: [main]

jobs:
  release:
    permissions:
      actions: read # Security Scan: SARIF upload reads run metadata on a private repo
      contents: write
      issues: write
      pull-requests: write
      packages: write
      id-token: write
      security-events: write
    # reusable-workflows#3: private repos skip the public MCP Registry publish
    # and the SARIF upload (Code Security is off); Trivy still gates the job.
    uses: WYRE-AI/reusable-workflows/.github/workflows/mcp-server-release.yml@508ef4ddcd19285d108423a27f44078a15451575
    with:
      server-name: alga-psa-mcp
      image-name: ghcr.io/wyre-ai/alga-psa-mcp
      fail-on-severity: HIGH,CRITICAL
    secrets: inherit
