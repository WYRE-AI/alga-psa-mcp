name: a path-traversal ID is rejected before any upstream call
server:
  command: node
  args: [dist/index.js]
  env:
    ALGA_INSTANCE_URL: http://psa.invalid
    ALGA_API_KEY: alga-eval-key-not-a-real-credential-0000
assert:
  tool: alga_tickets_get
  args:
    id: '../users'
  expect:
    is_error: true
    contains: ['id']
timeout: 30s
