name: write tools are refused by default, before any upstream call
server:
  command: node
  args: [dist/index.js]
  env:
    ALGA_INSTANCE_URL: http://psa.invalid
    ALGA_API_KEY: alga-eval-key-not-a-real-credential-0000
assert:
  tool: alga_tickets_create
  args: {}
  expect:
    is_error: true
    contains: ['turned off']
timeout: 30s
